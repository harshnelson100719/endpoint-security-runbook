<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endpoint Security Runbook</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0B0F1A;--bg2:#111827;--bg3:#0E1420;
  --surface:#1E2A3D;--surface2:#243049;
  --border:rgba(99,130,191,0.18);--border2:rgba(99,130,191,0.32);
  --blue:#3B82F6;--teal:#14B8A6;--green:#22C55E;--amber:#F59E0B;--purple:#8B5CF6;--red:#EF4444;
  --text:#F0F4FF;--text2:#94A3B8;--text3:#64748B;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(59,130,246,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.035) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}

/* LAYOUT */
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh;position:relative;z-index:1}

/* SIDEBAR */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
.sidebar-head{padding:1.5rem 1.25rem 1rem;border-bottom:1px solid var(--border)}
.sidebar-logo{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.logo-text{font-family:var(--mono);font-size:11px;color:var(--blue);letter-spacing:.08em;text-transform:uppercase}
.sidebar-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:.25rem}
.sidebar-sub{font-size:11px;color:var(--text3)}
.progress-wrap{padding:1rem 1.25rem;border-bottom:1px solid var(--border)}
.prog-numbers{display:flex;justify-content:space-between;margin-bottom:.5rem}
.prog-done{font-size:13px;font-weight:600;color:var(--blue)}
.prog-total{font-size:12px;color:var(--text3)}
.prog-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--blue);border-radius:2px;width:0%;transition:width .4s ease}
.nav{padding:.75rem 0;flex:1}
.nav-phase{margin-bottom:.25rem}
.nav-phase-btn{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:.5rem 1.25rem;display:flex;align-items:center;gap:8px;color:var(--text2);font-family:var(--sans);font-size:12px;font-weight:500;transition:color .15s}
.nav-phase-btn:hover{color:var(--text)}
.nav-phase-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.nav-phase-items{padding:0 0 .25rem 2.5rem}
.nav-item-btn{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:.3rem .75rem .3rem 0;color:var(--text3);font-family:var(--sans);font-size:11.5px;line-height:1.4;transition:color .15s;display:flex;align-items:center;gap:6px}
.nav-item-btn:hover{color:var(--text2)}
.nav-item-btn.active{color:var(--blue)}
.nav-check{width:14px;height:14px;border-radius:3px;border:1px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent}
.nav-check.done{background:var(--blue);border-color:var(--blue);color:white}

/* MAIN */
.main{padding:0}
.top-bar{padding:1.5rem 2rem 0;border-bottom:1px solid var(--border);margin-bottom:0;position:sticky;top:0;background:var(--bg);z-index:10}
.top-bar-inner{display:flex;align-items:center;gap:12px;padding-bottom:1rem}
.stack-badges{display:flex;flex-wrap:wrap;gap:6px}
.sbadge{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:3px;border:1px solid}
.sb-b{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3);color:#93C5FD}
.sb-p{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.3);color:#C4B5FD}
.sb-g{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#86EFAC}
.sb-a{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:#FCD34D}
.sb-t{background:rgba(20,184,166,.1);border-color:rgba(20,184,166,.3);color:#5EEAD4}

/* CONTENT */
.content{padding:2rem}

/* WELCOME SCREEN */
.welcome{max-width:620px}
.welcome h1{font-size:28px;font-weight:700;letter-spacing:-.03em;margin-bottom:.75rem}
.welcome h1 span{color:var(--blue)}
.welcome p{font-size:14px;color:var(--text2);line-height:1.75;margin-bottom:1.5rem}
.welcome-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:2rem}
.wcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.875rem 1rem}
.wcard-n{font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--blue);font-variant-numeric:tabular-nums}
.wcard-l{font-size:11px;color:var(--text3);margin-top:2px}
.start-btn{background:var(--blue);color:white;border:none;border-radius:8px;padding:.75rem 1.5rem;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.start-btn:hover{opacity:.85}

/* ITEM VIEW */
.item-view{max-width:720px}
.item-breadcrumb{font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:1rem;display:flex;align-items:center;gap:6px}
.item-breadcrumb span{color:var(--text2)}
.item-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:1.5rem}
.item-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.item-meta{flex:1}
.item-title{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:.35rem}
.item-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item-est{font-family:var(--mono);font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.ibadge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600}

/* WHY CARD */
.why-card{background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.5rem;display:flex;gap:12px}
.why-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.why-text{font-size:13px;color:var(--text2);line-height:1.65}
.why-label{font-family:var(--mono);font-size:10px;color:var(--blue);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.35rem;font-weight:600}

/* STEPS */
.steps-label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:1rem}
.steps{display:flex;flex-direction:column;gap:0;margin-bottom:1.5rem}
.step{display:flex;gap:16px;position:relative}
.step:not(:last-child)::before{content:'';position:absolute;left:17px;top:36px;bottom:0;width:1px;background:var(--border2)}
.step-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;flex-shrink:0;background:var(--surface);color:var(--text2);border:1px solid var(--border2);z-index:1;margin-top:1px}
.step-body{flex:1;padding-bottom:1.5rem}
.step-h{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:.35rem}
.step-b{font-size:13px;color:var(--text2);line-height:1.7}
.step-b code{font-family:var(--mono);font-size:11.5px;background:var(--surface2);color:#93C5FD;padding:1px 6px;border-radius:3px}

/* CALLOUTS */
.callout{margin-top:.75rem;padding:.65rem .875rem;border-radius:0 6px 6px 0;font-size:12px;line-height:1.65;display:flex;gap:8px}
.callout-tip{background:rgba(59,130,246,.08);border-left:2px solid var(--blue);color:var(--text2)}
.callout-warn{background:rgba(245,158,11,.08);border-left:2px solid var(--amber);color:#FCD34D}
.callout-icon{flex-shrink:0;font-size:13px}

/* COMPLETE BUTTON */
.complete-bar{display:flex;align-items:center;gap:12px;padding:1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:2rem}
.complete-btn{background:var(--green);color:white;border:none;border-radius:6px;padding:.6rem 1.25rem;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.complete-btn:hover{opacity:.85}
.complete-btn.done{background:var(--surface2);color:var(--text3);cursor:default}
.complete-btn.done:hover{opacity:1}
.complete-label{font-size:13px;color:var(--text2)}

/* NAV ARROWS */
.item-nav{display:flex;gap:10px;margin-top:1rem}
.inav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);border-radius:6px;padding:.6rem 1rem;font-family:var(--sans);font-size:12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.inav-btn:hover{background:var(--surface2);color:var(--text)}
.inav-btn:disabled{opacity:.3;cursor:default}
.inav-btn:disabled:hover{background:var(--surface);color:var(--text2)}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-logo">
        <div class="logo-dot"></div>
        <div class="logo-text">Security Runbook</div>
      </div>
      <div class="sidebar-title">Endpoint Security<br>Standard Review</div>
      <div class="sidebar-sub">M365 · Intune · SentinelOne · Qualys</div>
    </div>
    <div class="progress-wrap">
      <div class="prog-numbers">
        <span class="prog-done" id="prog-done">0 / 31 complete</span>
        <span class="prog-total" id="prog-pct">0%</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="top-bar">
      <div class="top-bar-inner">
        <div class="stack-badges">
          <span class="sbadge sb-b">M365</span>
          <span class="sbadge sb-b">Intune</span>
          <span class="sbadge sb-p">Entra ID</span>
          <span class="sbadge sb-g">SentinelOne</span>
          <span class="sbadge sb-a">Qualys</span>
          <span class="sbadge sb-t">Horizon</span>
          <span class="sbadge sb-t">Duo</span>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>

</div>

<script>
// ---- DATA INLINE ----
const RUNBOOK = [
  {
    phase:"Scope & Inventory", icon:"scope", color:"#3B82F6",
    items:[
      {
        id:"S1", title:"Confirm Intune enrollment status",
        tools:["Intune"], est:"20 min",
        why:"Unmanaged devices are blind spots. You can't secure what you can't see.",
        steps:[
          {h:"Sign in to Intune admin center", b:"Go to intune.microsoft.com and sign in with your Global Admin or Intune Administrator account."},
          {h:"Navigate to Devices > All devices", b:"In the left nav, click Devices then All devices. You'll see every enrolled device with OS, compliance state, and last check-in."},
          {h:"Filter by OS and compliance state", b:"Use the Filter option to slice by: OS (Windows/macOS/iOS/Android) and Compliance (Compliant / Non-compliant / Not evaluated / In grace period)."},
          {h:"Export the device list", b:"Click Export to download a CSV. Date-stamp it — this is your enrollment baseline for the assessment."},
          {h:"Cross-check against your asset register", b:"Compare the Intune export to your CMDB or HR-issued device list. Any device in the asset register but missing from Intune = coverage gap. List them explicitly."},
          {h:"Flag stale devices", b:"Sort by Last sync date. Devices that haven't synced in 30+ days show stale compliance data. Note them separately — they may be off-network, decommissioned, or lost."}
        ],
        tip:"Devices showing Not evaluated have never checked in against a compliance policy — they're invisible to Conditional Access enforcement.",
        warn:null
      },
      {
        id:"S2", title:"List all endpoint types in scope",
        tools:[], est:"30 min",
        why:"Scope creep and scope gaps are equally dangerous. You need a clear boundary before you start assessing controls.",
        steps:[
          {h:"Define your endpoint categories", b:"Work through each type systematically: corporate Windows laptops and desktops (Intune-managed), Horizon VDI sessions (persistent and non-persistent pools), corporate mobile devices (iOS/Android via Intune MDM or MAM-only), shared/kiosk devices."},
          {h:"Confirm Horizon VDI scope", b:"Log into Horizon Administrator console. Go to Catalog > Desktop Pools. List active pools, note whether they're persistent or non-persistent, and confirm whether the Qualys Cloud Agent is installed in the gold image."},
          {h:"Identify mobile device policy", b:"In Intune, go to Devices > By platform > iOS and Android. Confirm whether personal devices are BYOD (MAM-only, app-level policies only) or fully enrolled MDM. These have very different security postures."},
          {h:"Write a one-page scope statement", b:"Document: what's in scope, what's explicitly out of scope, and why. This anchors every subsequent finding and prevents disputes during reporting."}
        ],
        tip:null,
        warn:"IoT devices, printers, and OT endpoints should be explicitly listed as out of scope — not ignored. They're a lateral movement risk even if you can't manage them via Intune."
      },
      {
        id:"S3", title:"Identify unmanaged or non-compliant devices",
        tools:["Intune"], est:"45 min",
        why:"Non-compliant devices with access to corporate resources are your most immediate risk.",
        steps:[
          {h:"Filter for non-compliant devices", b:"Go to Devices > Monitor > Noncompliant devices. This is a pre-filtered view. Export it as a CSV."},
          {h:"Find devices never enrolled", b:"Subtract your full Intune device list from your HR/asset register. The difference = devices that exist in your environment but have never been enrolled. These are your highest risk."},
          {h:"Check Entra ID for unmanaged registered devices", b:"In Entra ID > Devices > All devices, filter by MDM: None. These are Entra-registered (perhaps via a browser sign-in) but not Intune-managed — common with personal BYOD."},
          {h:"Categorize each unmanaged device", b:"For each gap device determine: Corporate asset (force enroll, 30-day deadline), Contractor device (apply MAM without enrollment), Unknown device (escalate for investigation and potential network block)."},
          {h:"Assign owners and due dates", b:"Every unmanaged corporate device needs a named owner and a remediation deadline. Without this, the list sits untouched."}
        ],
        tip:"Non-compliant devices are automatically blocked from M365 apps once you wire compliance policy to Conditional Access. Validate that enforcement is actually working on a test device.",
        warn:null
      },
      {
        id:"S4", title:"Document out-of-scope endpoints",
        tools:[], est:"20 min",
        why:"Out-of-scope doesn't mean zero-risk. IoT and unmanaged devices on the same network are lateral movement paths.",
        steps:[
          {h:"Enumerate all networked devices outside Intune", b:"List: network printers, IP phones, smart TVs, IoT sensors, OT/SCADA equipment, visitor Wi-Fi devices. Gather: device name, IP, MAC, location, owner."},
          {h:"Verify network segmentation", b:"Confirm these devices are on a separate VLAN from corporate endpoints. They should not have direct routed access to domain controllers, file servers, or internal APIs."},
          {h:"Check for default credentials", b:"For any manageable out-of-scope device (printers, managed switches, IP phones), confirm default admin passwords have been changed. Default credentials + same-subnet access = easy lateral movement."},
          {h:"Log them in your asset register", b:"Even out-of-scope devices must be tracked. Add them to your CMDB with: device type, IP, MAC, VLAN, owner, and last reviewed date."}
        ],
        tip:null,
        warn:"Printers on the same subnet as user workstations with default credentials are a well-documented attack path. Don't dismiss them just because they're out of scope for this assessment."
      }
    ]
  },
  {
    phase:"Identity & Access", icon:"identity", color:"#8B5CF6",
    items:[
      {
        id:"I1", title:"Enforce MFA via Conditional Access",
        tools:["Entra"], est:"60 min",
        why:"MFA blocks over 99% of account compromise attacks. It's the single highest-ROI control you can implement.",
        steps:[
          {h:"Open Entra ID Conditional Access", b:"Go to entra.microsoft.com > Protection > Conditional Access > Policies."},
          {h:"Create a new CA policy", b:"Click New policy. Name it clearly: Require-MFA-AllUsers-AllApps."},
          {h:"Set user and resource assignments", b:"Users: All users. Target resources: All cloud apps. Conditions: leave open to cover all platforms and locations initially."},
          {h:"Set the grant control", b:"Under Grant, select Require multifactor authentication."},
          {h:"Exclude break-glass accounts", b:"Under Exclude > Users, add both break-glass accounts. Never apply MFA Conditional Access to these accounts — losing access during an incident is a serious operational risk."},
          {h:"Enable in report-only mode first", b:"Set the policy to Report-only. Monitor for 5-7 days in CA > Insights and Reporting. Look for unexpected blocks — service accounts, shared mailboxes, legacy clients."},
          {h:"Block legacy authentication separately", b:"Create a second CA policy: Conditions > Client apps > check Legacy authentication clients > Block. Legacy auth bypasses MFA entirely."},
          {h:"Switch to Enabled", b:"Once confident, flip to On. Communicate to users at least 48 hours before go-live. Have helpdesk ready."}
        ],
        tip:"Check sign-in logs for any accounts still authenticating via legacy protocols (SMTP AUTH, IMAP, POP3) before enabling — these will break silently and generate helpdesk tickets.",
        warn:null
      },
      {
        id:"I2", title:"Configure Duo passwordless / phishing-resistant MFA",
        tools:["Duo","Entra"], est:"90 min",
        why:"Standard MFA (push notification, SMS) is bypassable via real-time phishing. Phishing-resistant MFA is not.",
        steps:[
          {h:"Determine your Duo integration method", b:"Option A: Duo via SAML/OIDC federated to Entra (older setup, limited phishing-resistance). Option B: Duo as an External Authentication Method in Entra (newer, preferred). Confirm which you have before proceeding."},
          {h:"Enable FIDO2 security keys in Entra", b:"Go to Entra ID > Protection > Authentication methods > FIDO2 security key. Enable it and target your pilot group."},
          {h:"Configure Duo Verified Push", b:"In the Duo Admin Panel, navigate to your Entra application settings. Enable Verified Push — this requires the user to type a code shown on the login screen into the Duo app, defeating real-time phishing."},
          {h:"Set authentication strengths in CA", b:"In Entra CA > Grant, use Require authentication strength. Select Phishing-resistant MFA for high-value targets: Azure portal, Intune admin center, Entra ID console."},
          {h:"Pilot with a test group", b:"Apply the phishing-resistant CA policy to a pilot group of 10-15 users first. Validate the auth flow works end-to-end on browser, thick clients, and mobile."},
          {h:"Expand and monitor", b:"Roll out broadly. Monitor Entra sign-in logs and confirm the authentication method column shows FIDO2 or Passkey — not just 'federation'."}
        ],
        tip:null,
        warn:"If Duo is integrated via legacy SAML federation, the phishing-resistant signal may not pass through to Entra correctly. Verify in the sign-in log that the auth method registered is FIDO2 or Passkey, not MFA claim from federation."
      },
      {
        id:"I3", title:"Enable Windows LAPS",
        tools:["Intune","Entra"], est:"45 min",
        why:"Shared or known local admin passwords allow lateral movement across every device that shares them. LAPS gives every device a unique, rotated password.",
        steps:[
          {h:"Confirm prerequisites", b:"Windows LAPS (cloud-native) requires: Windows 11 22H2+ or Windows 10 22H2+ with April 2023 cumulative update. Devices must be Entra-joined or Hybrid Entra-joined and Intune-enrolled."},
          {h:"Enable LAPS in Entra ID", b:"Go to Entra ID > Devices > Device settings. Set Enable Microsoft Entra Local Administrator Password Solution (LAPS) to Yes."},
          {h:"Create LAPS policy in Intune", b:"Go to Endpoint Security > Account Protection > Create Policy. Select Windows > Local admin password solution (Windows LAPS)."},
          {h:"Configure policy settings", b:"Key settings: Backup directory = Azure Active Directory. Password age = 30 days. Password length = 20+ characters. Complexity = large + small letters + numbers + special characters. Post-authentication action = Reset password and log out."},
          {h:"Assign to all Windows devices", b:"Assign the policy to your All Windows Devices group. Devices will begin rotating on next check-in."},
          {h:"Restrict password retrieval via RBAC", b:"In Entra ID > Devices > Device settings > LAPS, restrict who can retrieve passwords. Only Helpdesk Administrators or a custom scoped role — not all users, not all IT staff."},
          {h:"Verify key escrow is working", b:"Pick a test device. Go to Entra ID > Devices > find device > Local administrator password. You should see a stored password with an expiry date."}
        ],
        tip:"Audit LAPS password retrieval events via Entra ID audit logs: filter for Activity = Recover device local administrator password. Any retrieval should be expected and documented.",
        warn:null
      },
      {
        id:"I4", title:"Restrict local admin rights via EPM",
        tools:["Intune"], est:"60 min",
        why:"Local admin rights on standard user accounts are the number one enabler of malware persistence and lateral movement.",
        steps:[
          {h:"Audit current local admin membership", b:"Use an Intune Remediation script to check local Administrators group membership across devices. PowerShell: Get-LocalGroupMember -Group Administrators. Export and review — you'll likely find surprises."},
          {h:"Create a Settings Catalog policy to control local admins", b:"Go to Devices > Configuration > Create > Settings Catalog. Search for Local Users and Groups. Add the Local User Group setting."},
          {h:"Configure the Administrators group", b:"Set Group: Administrators (built-in). Action: Restrict group (replace membership). Members: local Administrator account (managed by LAPS) only. Remove all standard user accounts from this list."},
          {h:"Configure EPM for elevation on demand", b:"In Intune > Endpoint Security, enable Endpoint Privilege Management. Create elevation rules for specific approved applications — software installers your users legitimately need. This replaces 'make them admin' with 'approve this specific app'."},
          {h:"Pilot on a test group first", b:"Assign to 5-10 test devices. Log in as a standard user and confirm the restrictions apply. Test EPM elevation for an approved app."},
          {h:"Communicate before broad rollout", b:"Users who previously had admin rights will notice immediately. Communicate the change, the reason, and the EPM process for elevation requests at least 1 week before cutover."}
        ],
        tip:null,
        warn:"Removing local admin from users who previously had it will break any software they were self-installing. Audit installed applications first — identify any that need elevation and add them to EPM rules before removing admin rights."
      },
      {
        id:"I5", title:"Verify break-glass accounts",
        tools:["Entra"], est:"30 min",
        why:"If every admin account is locked behind MFA and something goes wrong with Entra, you need a way back in. Break-glass accounts are that way back in.",
        steps:[
          {h:"Confirm break-glass account configuration", b:"You need at least 2 accounts that are: cloud-only (not synced from on-prem AD), assigned Global Administrator, not associated with any individual person, with a long complex password stored securely offline (printed, sealed envelope in a physical safe)."},
          {h:"Verify exclusion from every CA policy", b:"Go through every enabled CA policy. Under Exclude > Users, confirm both break-glass accounts are listed in all of them. Missing even one policy is a gap."},
          {h:"Confirm no MFA methods are registered", b:"In Entra ID > Users > find each break-glass account > Authentication methods. There should be zero MFA methods registered. These accounts authenticate with password only."},
          {h:"Set up alerting on any sign-in", b:"Configure a Microsoft Sentinel alert or Entra diagnostic rule that fires any time a break-glass account signs in. Treat any unexpected sign-in as a critical security event."},
          {h:"Test access quarterly", b:"Sign in with a break-glass account once per quarter to confirm it still works. Use a clean, dedicated device for this test. Document the test date and result."}
        ],
        tip:"Break-glass accounts should generate an alert every time they're used. If a sign-in happens that wasn't a scheduled test, investigate immediately.",
        warn:null
      }
    ]
  },
  {
    phase:"Endpoint Hardening", icon:"hardening", color:"#14B8A6",
    items:[
      {
        id:"H1", title:"Deploy BitLocker with XTS-AES 256 + TPM 2.0",
        tools:["Intune"], est:"45 min",
        why:"An unencrypted laptop that gets lost or stolen hands an attacker every file on the device. BitLocker makes that data unreadable without the TPM.",
        steps:[
          {h:"Confirm TPM 2.0 on target devices", b:"In Intune > Devices > select device > Hardware. Check TPM version. Or run on the device: Get-Tpm in PowerShell — TpmPresent and TpmReady should both return True."},
          {h:"Create a Disk Encryption policy", b:"Go to Endpoint Security > Disk Encryption > Create Policy > Windows > BitLocker."},
          {h:"Configure key settings", b:"Set: BitLocker enabled for OS, fixed, and removable drives. Encryption method: XTS-AES 256-bit for OS and fixed drives, AES-CBC 256 for removable. Startup authentication: Require TPM. Recovery key: Save to Azure AD (mandatory). Block non-TPM BitLocker: Yes."},
          {h:"Assign to all Windows devices", b:"Assign the policy to your All Windows Devices group. Encryption begins on next device check-in. Battery must be above 20% and the device should be plugged in for best results."},
          {h:"Monitor encryption status", b:"Go to Endpoint Security > Disk Encryption > Encryption report. Review per-device status: Encrypted, Not encrypted, In progress, Error. Key escrow status is shown per device."},
          {h:"Verify recovery key escrow", b:"Pick 3-5 test devices. Go to Entra ID > Devices > find device > BitLocker keys. Each device should show a recovery key with a rotation date. If missing, run on device: BackupToAAD-BitLockerKeyProtector cmdlet."}
        ],
        tip:"Devices encrypted before Intune enrollment may not automatically escrow their recovery key to Entra. Use an Intune Remediation script to detect and force key backup on these devices.",
        warn:null
      },
      {
        id:"H2", title:"Deploy Windows 11 Security Baseline",
        tools:["Intune"], est:"60 min",
        why:"300+ security settings, pre-configured to CIS and NIST recommendations. It's the fastest way to apply hardened defaults across your fleet.",
        steps:[
          {h:"Understand what's covered", b:"The Windows MDM Security Baseline covers: account lockout policies, audit logging, Windows Defender settings, firewall defaults, browser hardening, Credential Guard, and more. Review the full list at the Microsoft Intune documentation site before deploying."},
          {h:"Create a baseline profile", b:"Go to Endpoint Security > Security Baselines > Windows 11 Security Baseline > Create profile. Name it with the version and date: WIN11-Baseline-2024-Nov."},
          {h:"Review settings before deploying", b:"Scroll through and flag any settings that may conflict with your environment. Common conflicts: BitLocker settings (if you have a separate BitLocker policy), SMB signing (can break legacy file shares), Windows Firewall (may affect VPN split-tunnel)."},
          {h:"Pilot deploy to Ring 0", b:"Assign to a pilot group of 5-10 IT-managed devices. Monitor device configuration status in Endpoint Security > Security Baselines > your profile > Device status for 1-2 weeks."},
          {h:"Resolve conflicts", b:"Intune will flag conflicts where two policies set the same value differently. Open each conflict: go to Devices > select device > Device configuration. Resolve by deciding which policy owns that setting and removing it from the other."},
          {h:"Broad deployment", b:"Once stable in pilot, assign to all Windows devices. Document the baseline version deployed, the date, and any settings you customized from the default."}
        ],
        tip:null,
        warn:"Never deploy a Security Baseline to all production devices on day one. The pilot ring exists to catch unexpected breakage — SMB signing failures and VPN disconnections are common first-time surprises."
      },
      {
        id:"H3", title:"Apply Windows Firewall baseline",
        tools:["Intune"], est:"30 min",
        why:"Endpoint firewalls block inbound lateral movement attempts. A misconfigured or disabled firewall leaves the device open to network-based attacks from any device on the same network.",
        steps:[
          {h:"Create a Firewall policy", b:"Go to Endpoint Security > Firewall > Create Policy > Windows > Windows Firewall."},
          {h:"Set core rules for all profiles", b:"For Domain, Private, and Public profiles: Firewall enabled = Yes. Inbound connections = Block (default). Outbound connections = Allow (default). Disable firewall notifications to reduce user noise."},
          {h:"Add required inbound exceptions", b:"Add rules for: remote management tools your IT team uses (WMI, RPC if needed), monitoring agents (SentinelOne, Qualys Cloud Agent), any corporate app requiring inbound connections."},
          {h:"Validate VPN behavior", b:"After piloting, test that your VPN client connects normally and traffic routes correctly. Split-tunnel VPNs sometimes need specific allow rules for the VPN adapter."},
          {h:"Assign and monitor", b:"Assign to all Windows devices. Monitor via Endpoint Security > Firewall > MDM devices running Windows 10 with firewall off report to catch any devices where firewall disabled."}
        ],
        tip:"If the Security Baseline is already deployed, it includes basic firewall settings. Avoid creating a separate conflicting firewall policy — pick one source of truth for firewall configuration.",
        warn:null
      },
      {
        id:"H4", title:"Configure auto-lock: 5 min inactivity",
        tools:["Intune"], est:"20 min",
        why:"An unlocked, unattended laptop is a walk-up attack. Five minutes is the industry-standard balance between security and user annoyance.",
        steps:[
          {h:"Create a Settings Catalog profile", b:"Go to Devices > Configuration > Create > New Policy > Settings Catalog. Platform: Windows 10 and later. Give it a clear name: WIN-Inactivity-Lock-5min."},
          {h:"Add the inactivity setting", b:"In the settings picker, search for: Interactive logon machine inactivity limit. Add it to your profile."},
          {h:"Set the value to 300 seconds", b:"Set Interactive logon: Machine inactivity limit to 300 (seconds). This locks the screen after 5 minutes of no keyboard or mouse input, regardless of what the user has set personally."},
          {h:"Assign to all Windows devices", b:"Assign to your Windows device group. This is a machine-level setting — it applies to all users on that device regardless of their personal screen saver settings."},
          {h:"Verify on a test device", b:"After policy syncs (Settings > Accounts > Access work or school > Info > Sync), leave the device idle for 5 minutes with no input. The screen should lock automatically."}
        ],
        tip:"This is a machine policy equivalent. Whichever is shorter — the machine inactivity limit or the user's personal screen lock — wins. Users can set shorter timeouts but cannot set longer ones than the policy allows.",
        warn:null
      },
      {
        id:"H5", title:"Enable Dynamic Lock",
        tools:["Intune"], est:"30 min",
        why:"Users forget to lock their screens. Dynamic Lock locks automatically when they walk away, using their phone's Bluetooth signal as a presence indicator.",
        steps:[
          {h:"Confirm hardware compatibility", b:"Dynamic Lock works via Bluetooth (phone paired to laptop) or Windows Hello IR camera presence detection. Check your device models — Dell Latitude, HP EliteBook, and Lenovo ThinkPad modern lines support both methods."},
          {h:"Enable Dynamic Lock via Settings Catalog", b:"In Devices > Configuration > Settings Catalog, search for Allow Dynamic Lock. Set to Enabled."},
          {h:"Enable Windows Hello for Business if using presence detection", b:"If relying on IR camera presence, ensure Windows Hello for Business is enabled in your Intune configuration. Dynamic Lock's presence detection is tied to Windows Hello on supported hardware."},
          {h:"Instruct users to pair their phone", b:"For the Bluetooth method, users pair their phone via Settings > Bluetooth and devices. When they walk away with their phone and signal drops, the laptop locks within approximately 30 seconds."},
          {h:"Test the behavior", b:"Pair a phone, walk away from the test laptop until the Bluetooth signal is lost. The device should lock automatically. Confirm in Settings > Accounts > Sign-in options > Dynamic lock that it shows Phone connected."}
        ],
        tip:null,
        warn:"Dynamic Lock is a supplementary control — not a replacement for the inactivity timeout. The 5-minute timer is your primary lock. Dynamic Lock is the faster, presence-aware layer on top of it."
      },
      {
        id:"H6", title:"Enable ASR rules — audit then enforce",
        tools:["Intune"], est:"90 min",
        why:"ASR rules block the specific OS behaviors malware relies on — macro-spawned processes, credential theft from LSASS, obfuscated script execution. They're targeted and highly effective.",
        steps:[
          {h:"Create an ASR policy in Intune", b:"Go to Endpoint Security > Attack Surface Reduction > Create Policy > Windows > Attack surface reduction rules."},
          {h:"Set all rules to Audit mode", b:"For every rule, set the value to Audit mode. This logs what would have been blocked without blocking anything. Priority rules to audit first: Block credential stealing from LSASS, Block Office apps from creating child processes, Block execution of potentially obfuscated scripts, Block untrusted and unsigned processes from USB."},
          {h:"Run audit mode for 2 full weeks", b:"Two weeks covers typical business cycles — month-end reporting, weekly all-hands, IT maintenance windows. Shorter audit periods miss edge-case applications."},
          {h:"Review audit detections", b:"Go to Microsoft Defender portal > Reports > Attack surface reduction rules. Look for legitimate business applications being flagged. Common false positives: legacy LOB apps, IT packaging tools, some admin utilities."},
          {h:"Create exclusions for confirmed false positives", b:"For any legitimate software flagged, add exclusions in the ASR policy by: file path, process name, or certificate. Add exclusions before switching to Block mode — not after."},
          {h:"Switch rules to Block one at a time", b:"Update each rule from Audit to Block. Do them one or two at a time, not all at once. This way if something breaks, you know exactly which rule caused it."}
        ],
        tip:"Start with the credential theft and Office child process rules — these have the highest security value and typically the fewest false positives in standard business environments.",
        warn:"Switching all ASR rules to Block simultaneously without audit review is a reliable way to break business-critical software. The 2-week audit window is not optional — it's what separates a smooth rollout from an emergency rollback."
      },
      {
        id:"H7", title:"Disable USB/removable storage",
        tools:["Intune"], est:"45 min",
        why:"USB drives are one of the oldest and most reliable data exfiltration vectors. If users don't need them, there's no reason to leave them enabled.",
        steps:[
          {h:"Identify who legitimately needs USB access", b:"Work with business units before locking anything down. Typical legitimate needs: IT team (bootable media, imaging), finance (hardware tokens like YubiKey — note: HID class, not storage), AV/multimedia teams. Everyone else: block."},
          {h:"Create a block policy via Settings Catalog", b:"In Devices > Configuration > Settings Catalog, search for Removable disk. Add All removable storage classes: Deny all access and set to Enabled."},
          {h:"Create an exemption policy for authorized users", b:"Create a second Settings Catalog policy with the same setting but set to Disabled (allowing access). Assign this to a security group containing authorized users only."},
          {h:"Use Device Control for finer-grained access", b:"For more control — allow specific approved USB device hardware IDs while blocking all others — use Endpoint Security > Attack Surface Reduction > Device Control policies. This lets you allow a specific YubiKey model while blocking all generic USB drives."},
          {h:"Assign block policy broadly, exemption to authorized group", b:"The block policy goes to All Devices. The exemption policy goes to your authorized users group. In policy conflicts, the allow typically wins — test this on a pilot device first."},
          {h:"Test and communicate", b:"Insert a USB drive on a test device with the block policy applied. It should show no response or Access Denied. Communicate the change to users 1 week before rollout."}
        ],
        tip:"YubiKeys and RSA hardware tokens use the HID (Human Interface Device) class, not the removable storage class. A storage block policy will not affect them — you don't need to exempt them.",
        warn:null
      }
    ]
  },
  {
    phase:"Threat Detection", icon:"threat", color:"#22C55E",
    items:[
      {
        id:"T1", title:"Confirm SentinelOne agent coverage",
        tools:["S1"], est:"30 min",
        why:"A single unprotected endpoint is all an attacker needs. Coverage gaps are blind spots.",
        steps:[
          {h:"Pull agent coverage report from S1", b:"In the SentinelOne Management Console, go to Endpoints. Export the full list as CSV. Capture: hostname, agent version, last seen date, site, group assignment."},
          {h:"Cross-reference with Intune device list", b:"Export your Intune device list. Compare by hostname. Devices in Intune but missing from S1 = unprotected endpoints. List them with owner and location."},
          {h:"Check deployment method", b:"Confirm how S1 is being deployed — Intune Win32 app, SCCM, or GPO. Validate the deployment assignment targets All Devices, not a subset or pilot group that was never expanded."},
          {h:"Identify stale or offline agents", b:"In S1 console, filter for Last seen more than 7 days ago. These devices aren't checking in — they may be powered off, decommissioned, or isolated from the network."},
          {h:"Deploy agent to coverage gaps", b:"For unprotected devices, package the S1 agent as a Win32 app in Intune (Apps > Windows > Add > Win32 app). The installer must include your site-specific token — get it from S1 console under Settings > Sites."}
        ],
        tip:"SentinelOne site tokens are environment-specific. Using the wrong token enrolls the device to the wrong S1 site where your policies don't apply — double-check the token before packaging.",
        warn:null
      },
      {
        id:"T2", title:"Validate S1 protect mode is active",
        tools:["S1"], est:"20 min",
        why:"Detect mode tells you about threats. Protect mode stops them. Running detect-only means you're watching malware run.",
        steps:[
          {h:"Check policy mode in S1 console", b:"Go to Sentinels > Policies. For each policy group, check the Protection Mode setting. It should read Protect — not Detect."},
          {h:"Check every level of the hierarchy", b:"S1 policies are hierarchical: Global > Site > Group. A group-level policy can override the site policy. A single group left in Detect mode while everything else is in Protect mode is a gap."},
          {h:"Validate AI and protection settings within the policy", b:"Within each policy, confirm: Behavioral AI = Enabled, Static AI = Enabled, Ransomware protection = Enabled, On-write scan = Enabled. These should all be on in Protect mode."},
          {h:"Test with EICAR test file", b:"Download the EICAR test file (eicar.com) on a test endpoint. In Protect mode, S1 should automatically quarantine it before it can be opened. Confirm detection in the S1 Threats dashboard."},
          {h:"Document any groups intentionally left in Detect", b:"If any group is in Detect mode for a legitimate reason (legacy software compatibility), document it with a risk acceptance sign-off. Don't leave it as an undocumented exception."}
        ],
        tip:null,
        warn:"Leaving groups in Detect mode because of vague 'business concerns' without formal sign-off is not a risk acceptance — it's an undocumented gap. Every Detect-mode exception needs a named owner and a target date for moving to Protect."
      },
      {
        id:"T3", title:"Enable S1 Tamper Protection",
        tools:["S1"], est:"15 min",
        why:"Malware that can disable your EDR agent has effectively blinded your detection. Tamper Protection makes the agent unkillable without a passphrase.",
        steps:[
          {h:"Locate Tamper Protection in policy settings", b:"In S1 Management Console, go to Sentinels > Policies > select your policy > Agent tab."},
          {h:"Enable Anti-Tamper", b:"Set Anti-Tamper to Enabled. Save and publish the policy. This prevents the S1 service from being stopped, paused, or uninstalled without the passphrase."},
          {h:"Set and secure the Anti-Tamper passphrase", b:"The passphrase is required to uninstall or disable the agent locally. Store it in your corporate password vault (not personal). Restrict access to senior IT staff only."},
          {h:"Test tamper protection", b:"On a test device, try to stop the SentinelOne service: open services.msc and click Stop on SentinelAgent. It should fail with Access Denied. Also try: Stop-Service -Name SentinelAgent in PowerShell — same result."},
          {h:"Confirm tamper attempts are logged", b:"Any tamper attempt generates an event in S1 console under Activity. Verify the test attempt appeared in the log."}
        ],
        tip:"Tamper Protection should be enabled on 100% of endpoints. An endpoint without it can be neutralized by an attacker or malware before S1 can respond — the agent goes silent and you don't know why.",
        warn:null
      },
      {
        id:"T4", title:"Confirm S1 is sole EDR — no dual-agent conflict",
        tools:["S1","Intune"], est:"30 min",
        why:"Two active EDR agents on the same device cause missed detections, excessive CPU load, and unpredictable behavior. One of them must be passive or absent.",
        steps:[
          {h:"Determine your EDR strategy", b:"Pick one: SentinelOne as your sole EDR, or Microsoft Defender for Endpoint (MDE) as primary with S1 in a co-management role. You should not have both running in full active protection simultaneously."},
          {h:"Check Defender AV status on test devices", b:"Run in PowerShell: Get-MpComputerStatus. If AMRunningMode returns Normal, Defender AV is actively running alongside S1. If it returns Passive, it's correctly co-existing with S1."},
          {h:"If S1 is your sole EDR — put Defender in passive", b:"S1 should automatically push Defender into passive mode on installation. If it hasn't, create an Intune Settings Catalog policy: search Allow Antivirus and set Defender AV: Turn off Windows Defender Antivirus. Verify passive mode after next sync."},
          {h:"If running MDE alongside S1", b:"Configure co-existence mode: S1 handles active protection, MDE handles telemetry and SIEM integration. This requires specific configuration in both consoles — follow S1's official MDE co-management documentation for your S1 version."},
          {h:"Verify performance post-configuration", b:"Check CPU and memory usage on endpoint devices during normal business hours. Dual full-scan EDRs add 15-30% resource overhead. If users are complaining about slowness, check Get-Process | Sort CPU for SentinelAgent and MsMpEng."}
        ],
        tip:null,
        warn:"This is one of the most commonly misconfigured items in environments that adopted S1 after already having Defender. Always explicitly check AMRunningMode — installed does not mean active, and active does not mean correctly configured."
      },
      {
        id:"T5", title:"Triage S1 alerts older than 48 hours",
        tools:["S1"], est:"60 min",
        why:"An alert that's been sitting for 3 days is an incident that wasn't responded to. Stale alerts indicate either a process gap or a real threat that's had time to spread.",
        steps:[
          {h:"Open Incidents > Threats, filter Unresolved", b:"In S1 console, go to Incidents > Threats. Filter by Status: Unresolved. Sort by Created date ascending to see oldest first."},
          {h:"Triage each open threat", b:"For each alert, determine: True positive or false positive? Has S1 taken automated action (quarantine, kill, remediate)? Is the affected endpoint still network-connected or isolated?"},
          {h:"Escalate any critical unresolved threats", b:"Any threat classified as Malicious with no action taken and no owner is a critical finding. Escalate immediately to your security lead. Do not document and move on — respond first."},
          {h:"Resolve confirmed false positives and add exclusions", b:"For confirmed false positives: mark as Resolved > False Positive in S1. If the same FP keeps recurring from the same path or process, add a permanent exclusion in the relevant S1 policy."},
          {h:"Document findings for the assessment", b:"Record: total open threats, oldest unresolved date, number of Critical/High with no action taken, actions you took during triage."},
          {h:"Formalize an alert SLA", b:"Recommend establishing: Critical = respond within 4 hours, High = 24 hours, Medium = 5 business days. Assign a named owner for daily alert review. Document this in your process runbook."}
        ],
        tip:"If you find threats that are weeks old with no action taken, this is a process failure — not just a tooling issue. The alert review cadence needs to be assigned to a specific person, with a named backup.",
        warn:null
      }
    ]
  },
  {

    items:[
      {
        id:"V1", title:"Run authenticated Qualys scan",
        tools:["Qualys"], est:"60 min",
        why:"You can't patch what you don't know is vulnerable. A Qualys Cloud Agent scan gives you authenticated, local vulnerability data without scan credentials or network dependencies.",
        steps:[
          {h:"Confirm Cloud Agent deployment", b:"In Qualys portal, go to Cloud Agent > Agents. Check all in-scope endpoints show an active agent with a recent last check-in timestamp (within 24-48 hours). Cross-reference with your Intune device list."},
          {h:"Deploy agent to gap devices", b:"Download the Qualys Cloud Agent MSI from the portal — it has your activation key embedded. Package as a Win32 app in Intune and deploy to All Devices. The agent activates and starts reporting within 1-2 hours of first boot."},
          {h:"Trigger an on-demand scan", b:"In Qualys, go to Vulnerability Management > Scans > New Scan. Select Cloud Agent scan. Target your asset group. Cloud Agents scan locally — no scan credentials required, no firewall rules needed."},

      {
        id:"V2", title:"Identify and prioritize critical/high CVEs",
        tools:["Qualys"], est:"45 min",
        why:"Not all vulnerabilities are equal. Prioritizing by exploitability and exposure prevents you from patching low-risk items while high-risk ones sit open.",
        steps:[
          {h:"Filter by severity in Qualys", b:"In Vulnerability Management > Vulnerabilities, filter by Severity: 4 and 5 (Qualys scale maps roughly to CVSS 7.0-10.0). Sort by CVSS score descending."},
          {h:"Layer in exploitability context", b:"Within your critical/high list, further prioritize: Is the CVE on the CISA Known Exploited Vulnerabilities (KEV) list? Is the affected software internet-facing (browsers, VPN clients)? Does it handle credentials (SSO agents, password managers)?"},
          {h:"Group by software title", b:"Export the findings and group by affected application. This tells you: patch Chrome across 200 devices vs. patch one obscure LOB app on 3 devices. Sequence by volume and risk."},
          {h:"Assign remediation SLAs", b:"Apply these deadlines: Critical + KEV listed = 7 days. High (CVSS 7.0-8.9) = 15 days. Medium (CVSS 4.0-6.9) = 30 days. Low = next scheduled maintenance cycle."},
          {h:"Assign owners per software/system", b:"Map each finding to a named owner: Intune admin for OS and managed app patches, application owner for LOB software, infra team for anything server-side."},
          {h:"Validate remediation with a rescan", b:"After patching, run a targeted Qualys scan on the same asset group. Confirm the specific CVE no longer appears. Don't close the finding based on change ticket alone — verify in the tool."}
        ],
        tip:null,
        warn:"CVSS score alone is insufficient for prioritization. A CVSS 7.5 actively exploited in your internet-facing VPN client is more urgent than a CVSS 9.8 in an air-gapped test system. Always layer in context."

      {
        id:"V3", title:"Configure Windows Update for Business rings",
        tools:["Intune"], est:"45 min",
        why:"Unpatched OS is the most common attack vector for ransomware and worms. Update rings give you control over rollout speed without leaving devices unpatched indefinitely.",
        steps:[
          {h:"Create your ring structure", b:"Set up 3 rings: Ring 0 = IT pilot (5-10 IT devices, 0-day deferral), Ring 1 = Early adopters (10-15% of users, 7-day deferral), Ring 2 = Broad production (remaining users, 14-day deferral)."},
          {h:"Create Entra ID groups for each ring", b:"In Entra ID, create security groups: WUfB-Ring0-Pilot, WUfB-Ring1-Early, WUfB-Ring2-Broad. Populate them with appropriate devices."},
          {h:"Create an Update Ring policy per ring", b:"Go to Devices > Windows update rings > Create profile. Name it matching the ring. Configure per ring: Quality update deferral (Ring 0: 0 days, Ring 1: 7 days, Ring 2: 14 days). Feature update deferral: 30 days for all rings. Deadline for quality updates: 5 days after deferral ends. Restart grace period: 2 days."},
          {h:"Assign policies to groups", b:"Assign each update ring policy to its corresponding Entra ID group. Devices in multiple groups will receive the most restrictive policy — avoid overlapping group membership."},
          {h:"Monitor update compliance", b:"Go to Devices > Monitor > Windows update rings overview. Track percentage of devices on the latest patch per ring. Investigate any device stuck more than 30 days behind."}
        ],
        tip:"Set a Deadline for quality updates (5 days) alongside your deferral period. Without a deadline, users can keep dismissing restart prompts indefinitely — the patch gets deferred but never actually installs.",
        warn:null
      },
      {
        id:"V4", title:"Audit third-party software patches",
        tools:["Qualys","Intune"], est:"45 min",
        why:"Chrome, Adobe Reader, and Zoom are in the top exploited software list every year. OS patching without third-party app patching is half the job.",
        steps:[
          {h:"Pull third-party findings from Qualys", b:"In Qualys, filter vulnerabilities by Category: Third-party software. Or search for specific titles: Chrome, Adobe Reader, 7-Zip, Java, Firefox, Zoom, Teams desktop, VLC."},

          {h:"Identify which apps are Intune-managed", b:"In Intune > Apps > All apps, check which of your flagged software is deployed via Intune. Intune-managed apps can be updated by pushing a new version through the portal."},
          {h:"Update Intune-managed apps", b:"For each app: add a new app version in Intune, set the old version as superseded in the supersedence settings. Intune will push the update silently on next device check-in."},
          {h:"Handle unmanaged apps via Remediation scripts", b:"For apps installed outside Intune by users, create an Intune Remediation script: Detection = check version number, Remediation = silent update via winget or direct installer download and run."},

      {

  {

    items:[
      {
        id:"C1", title:"Build Intune compliance policy",
        tools:["Intune"], est:"45 min",
        why:"Compliance policies define what 'secure' looks like for a device. Without them, Conditional Access has nothing to evaluate — every device looks compliant by default.",
        steps:[
          {h:"Create a compliance policy", b:"Go to Devices > Compliance > Create policy > Windows 10 and later. Name it: WIN-Compliance-Baseline-v1."},
          {h:"Configure required settings", b:"Set at minimum: BitLocker required = Yes. Secure Boot enabled = Yes. Code integrity enabled = Yes. Microsoft Defender Antimalware required = Yes. Real-time protection = Required. Windows Firewall = Required. Minimum OS version = your minimum supported build (e.g., 10.0.19045 for 22H2)."},
          {h:"Set the non-compliance grace period", b:"Under Actions for noncompliance, set a grace period of 3-5 days before marking the device non-compliant. This gives devices time to sync and apply missing settings before being blocked."},

          {h:"Identify top non-compliance reasons", b:"The compliance report shows per-setting failure counts. If BitLocker is failing on 40 devices, that's your highest-priority remediation — not a device-by-device investigation."}

        tip:"Compliance policies assess state — they don't enforce it. A device that's non-compliant keeps working until Conditional Access uses that non-compliant signal to block access. The policy alone has no teeth.",

        ],

// ---- APP STATE ----
const badgeMap={Intune:"sb-b",S1:"sb-g",Qualys:"sb-a",Entra:"sb-p",Duo:"sb-t"};
const states = JSON.parse(localStorage.getItem("rb_states")||"{}");
let currentItem = null;
let allItems = [];

// flatten all items
RUNBOOK.forEach((ph,pi)=>{
  ph.items.forEach((item,ii)=>{
    allItems.push({...item, phaseIdx:pi, itemIdx:ii, globalIdx:allItems.length});
  });
});

// ---- BUILD NAV ----
function buildNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML="";
  RUNBOOK.forEach((ph,pi)=>{
    const phDiv = document.createElement("div");
    phDiv.className="nav-phase";
    const phBtn = document.createElement("button");
    phBtn.className="nav-phase-btn";
    phBtn.innerHTML=`<div class="nav-phase-dot" style="background:${ph.color}"></div>${ph.phase}`;
    const phItems = document.createElement("div");
    phItems.className="nav-phase-items";
    ph.items.forEach((item,ii)=>{
      const gi = allItems.findIndex(a=>a.phaseIdx===pi&&a.itemIdx===ii);
      const btn = document.createElement("button");
      btn.className="nav-item-btn"+(currentItem===gi?" active":"");
      btn.id="nav-btn-"+gi;
      const isDone = !!states[item.id];
      btn.innerHTML=`<div class="nav-check${isDone?" done":""}" id="nav-chk-${gi}">${isDone?"✓":""}</div>${item.title}`;
      btn.addEventListener("click",()=>showItem(gi));
      phItems.appendChild(btn);
    });
    phBtn.addEventListener("click",()=>phItems.classList.toggle("hidden"));
    phDiv.appendChild(phBtn);
    phDiv.appendChild(phItems);
    nav.appendChild(phDiv);
  });
}

// ---- SHOW WELCOME ----
function showWelcome(){
  currentItem=null;
  document.querySelectorAll(".nav-item-btn").forEach(b=>b.classList.remove("active"));
  const total=allItems.length;
  const done=allItems.filter(a=>states[a.id]).length;
  document.getElementById("content").innerHTML=`
    <div class="welcome">
      <h1>Endpoint Security<br><span>Runbook</span></h1>
      <p>Step-by-step procedures for all 31 security controls across your M365, Intune, SentinelOne, and Qualys environment. Use the sidebar to navigate between items. Each item shows you exactly what to do, where to go, and what to watch out for.</p>
      <div class="welcome-grid">
        <div class="wcard"><div class="wcard-n">${total}</div><div class="wcard-l">total procedures</div></div>
        <div class="wcard"><div class="wcard-n">${done}</div><div class="wcard-l">completed</div></div>
        <div class="wcard"><div class="wcard-n">${total-done}</div><div class="wcard-l">remaining</div></div>
        <div class="wcard"><div class="wcard-n">${Math.round(done/total*100)}%</div><div class="wcard-l">progress</div></div>
      </div>
      <button class="start-btn" onclick="showItem(0)">Start from beginning →</button>
    </div>`;
}

// ---- SHOW ITEM ----
function showItem(gi){
  currentItem=gi;
  const a=allItems[gi];
  const ph=RUNBOOK[a.phaseIdx];
  document.querySelectorAll(".nav-item-btn").forEach(b=>b.classList.remove("active"));
  const navBtn=document.getElementById("nav-btn-"+gi);
  if(navBtn){navBtn.classList.add("active"); navBtn.scrollIntoView({block:"nearest"});}

  const isDone=!!states[a.id];
  const badges=(a.tools||[]).map(t=>`<span class="sbadge ${badgeMap[t]||"sb-b"}">${t}</span>`).join(" ");

  const stepsHtml=a.steps.map((s,si)=>`
    <div class="step">
      <div class="step-num">${si+1}</div>
      <div class="step-body">
        <div class="step-h">${s.h}</div>
        <div class="step-b">${s.b}</div>
      </div>
    </div>`).join("");

  const tipHtml=a.tip?`<div class="callout callout-tip"><div class="callout-icon">💡</div><div>${a.tip}</div></div>`:"";
  const warnHtml=a.warn?`<div class="callout callout-warn"><div class="callout-icon">⚠️</div><div>${a.warn}</div></div>`:"";

  const prevDisabled=gi===0?"disabled":"";
  const nextDisabled=gi===allItems.length-1?"disabled":"";

  document.getElementById("content").innerHTML=`
    <div class="item-view">
      <div class="item-breadcrumb">${ph.phase} <span>›</span> ${a.id}</div>
      <div class="item-header">
        <div class="item-icon" style="background:${ph.color}22;color:${ph.color}">
          ${phaseIcon(ph.icon)}
        </div>
        <div class="item-meta">
          <div class="item-title">${a.title}</div>
          <div class="item-row">
            <span class="item-est">⏱ ${a.est}</span>
            ${badges}
          </div>
        </div>
      </div>
      <div class="why-card">
        <div class="why-icon">🎯</div>
        <div>
          <div class="why-label">Why this matters</div>
          <div class="why-text">${a.why}</div>
        </div>
      </div>
      <div class="steps-label">Step-by-step procedure</div>
      <div class="steps">${stepsHtml}</div>
      ${tipHtml}${warnHtml}
      <div class="complete-bar">
        <button class="complete-btn${isDone?" done":""}" id="complete-btn" onclick="toggleDone(${gi})">
          ${isDone?"✓ Completed":"Mark as complete"}
        </button>
        <span class="complete-label" id="complete-label">${isDone?"This item is done — move to the next one.":"Complete the steps above, then mark this item done."}</span>
      </div>
      <div class="item-nav">
        <button class="inav-btn" ${prevDisabled} onclick="showItem(${gi-1})">← Previous</button>
        <button class="inav-btn" ${nextDisabled} onclick="showItem(${gi+1})">Next →</button>
      </div>
    </div>`;
}

function phaseIcon(icon){
  const icons={scope:"🔍",identity:"🔐",hardening:"🛡️",threat:"⚡",vuln:"🔬",compliance:"📋"};
  return icons[icon]||"📌";
}

function toggleDone(gi){
  const a=allItems[gi];
  const isDone=!!states[a.id];
  states[a.id]=!isDone;
  try{localStorage.setItem("rb_states",JSON.stringify(states));}catch(e){}
  updateProgress();
  buildNav();
  // update button in-place
  const btn=document.getElementById("complete-btn");
  const lbl=document.getElementById("complete-label");
  if(btn){
    btn.className="complete-btn"+(!isDone?" done":"");
    btn.textContent=!isDone?"✓ Completed":"Mark as complete";
  }
  if(lbl) lbl.textContent=!isDone?"This item is done — move to the next one.":"Complete the steps above, then mark this item done.";
}

function updateProgress(){
  const total=allItems.length;
  const done=allItems.filter(a=>states[a.id]).length;
  document.getElementById("prog-done").textContent=`${done} / ${total} complete`;
  document.getElementById("prog-pct").textContent=Math.round(done/total*100)+"%";
  document.getElementById("prog-fill").style.width=Math.round(done/total*100)+"%";
}

// ---- INIT ----
buildNav();
updateProgress();
showWelcome();
</script>
</body>
</html>
