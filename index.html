          {h:"Populate from your assessment findings", b:"Go through all 31 checklist items. For any item that is not fully completed or has deviations, add a row to the gap register. Be specific about the current state — percentages, counts, and tool names."},
          {h:"Apply a consistent risk rating", b:"Critical = Exploitable vulnerability, no compensating controls, immediate business risk. High = Significant exposure, compensating controls present but inadequate. Medium = Moderate exposure, controls exist but need improvement. Low = Minor deviation, low likelihood or impact."},
          {h:"Assign realistic due dates", b:"Critical: 7-14 days. High: 30 days. Medium: 60-90 days. Low: next review cycle. Set dates you can actually hit — overly aggressive deadlines that slip destroy credibility."},
          {h:"Assign named owners", b:"Every gap needs a named individual — not a team, a role, or a department. If no one specific is assigned, it will not get fixed."},
          {h:"Get formal sign-off", b:"Have your manager or CISO sign off on the gap register. This creates accountability, satisfies audit requirements, and ensures leadership is aware of the current state."}
        ],
        tip:"A gap register that lives only in your email inbox is not a gap register. Store it in SharePoint, Confluence, or your ITSM platform — somewhere the whole team can see, update, and track.",
        warn:null
      },
      {
        id:"C5", title:"Create ongoing assessment process document",
        tools:[], est:"60 min",
        why:"The security posture you've built today degrades silently without a recurring review process. This document is what makes the assessment continuous, not a one-time exercise.",
        steps:[
          {h:"Define your recurring cadence", b:"Document the schedule: Monthly = Qualys vulnerability scan, review open S1 alerts, patch compliance check. Quarterly = Intune policy review, CA policy audit, LAPS rotation verification, compliance report to management. Annually = Full endpoint security assessment (this exercise), security baseline version review, user security awareness training."},
          {h:"Assign named owners to each task", b:"Every recurring task needs a primary owner and a named backup. Write their actual names — not their role titles. Role titles change; names make people accountable."},

// ==================== STATUS HELPERS ====================
function getSetupStatus(id){ return setupStates[id]||"todo"; }
function getOpsData(id){ return opsStates[id]||{history:[]}; }

function getOpsStatus(id){
  const d=getOpsData(id);
  const task=OPS_TASKS.find(t=>t.id===id);
  if(!d.history||d.history.length===0) return "never";
  const last=new Date(d.history[d.history.length-1].date);
  const daysSince=Math.floor((Date.now()-last)/(1000*60*60*24));
  if(daysSince>task.cadenceDays+3) return "overdue";
  if(daysSince>task.cadenceDays-3) return "due";
  return "ontrack";
}

function getOpsDaysUntilDue(id){
  const d=getOpsData(id);
  const task=OPS_TASKS.find(t=>t.id===id);
  if(!d.history||d.history.length===0) return null;
  const last=new Date(d.history[d.history.length-1].date);
  const next=new Date(last.getTime()+task.cadenceDays*86400000);
  return Math.ceil((next-Date.now())/86400000);
}

// ==================== PROGRESS ====================
function updateProgress(){
  const sv=setupItems.filter(a=>getSetupStatus(a.id)==="verified").length;
  const si=setupItems.filter(a=>getSetupStatus(a.id)==="inplace").length;
  const ov=OPS_TASKS.filter(t=>getOpsStatus(t.id)==="overdue").length;
  document.getElementById("p-ver").textContent=sv;
  document.getElementById("p-inp").textContent=si;
  document.getElementById("p-ov").textContent=ov;
  const total=setupItems.length;
  const pct=Math.round((sv+si*0.5)/total*100);
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("topbar-pos").textContent=currentItem?`${currentTrack==="setup"?"Setup":"Ops"} · ${currentItem.gi+1} of ${currentTrack==="setup"?setupItems.length:OPS_TASKS.length}`:"";
}

function buildNav(){
  const nav=document.getElementById("nav");
  nav.innerHTML="";
  if(currentTrack==="setup"){
    RUNBOOK.forEach((ph,pi)=>{
      const lbl=document.createElement("div");
      lbl.className="nav-section-label";lbl.textContent=ph.phase;nav.appendChild(lbl);
      ph.items.forEach((item,ii)=>{
        const gi=setupItems.findIndex(a=>a.phaseIdx===pi&&a.itemIdx===ii);
        const s=getSetupStatus(item.id);
        const el=document.createElement("div");
        el.className="nav-item"+(currentItem&&currentItem.track==="setup"&&currentItem.gi===gi?" active":"");
        el.id="ni-"+gi;
        if(!navShouldShow(gi,"setup")) el.classList.add("hidden");
        el.innerHTML=`<div class="nav-dot ${s}"></div><div class="nav-label">${item.title}</div><div class="nav-id">${item.id}</div>`;
        el.addEventListener("click",()=>showSetupItem(gi));
        nav.appendChild(el);
      });
    });
  } else {
    const lbl=document.createElement("div");
    lbl.className="nav-section-label";lbl.textContent="Recurring tasks";nav.appendChild(lbl);
    OPS_TASKS.forEach((task,i)=>{
      const s=getOpsStatus(task.id);
      const el=document.createElement("div");
      el.className="nav-item"+(currentItem&&currentItem.track==="ops"&&currentItem.gi===i?" active":"");
      el.id="oni-"+i;
      if(!navShouldShow(i,"ops")) el.classList.add("hidden");
      el.innerHTML=`<div class="nav-dot ${s}"></div><div class="nav-label">${task.title}</div><div class="nav-id">${task.id}</div>`;
      el.addEventListener("click",()=>showOpsItem(i));
      nav.appendChild(el);
    });
  }
}

function navShouldShow(gi,track){
  const search=document.getElementById("sidebar-search")?.value.toLowerCase()||"";
  if(track==="setup"){
    const a=setupItems[gi]; const s=getSetupStatus(a.id);
    const mf=currentFilter==="all"||s===currentFilter;
    const ms=!search||a.title.toLowerCase().includes(search)||a.id.toLowerCase().includes(search);
    return mf&&ms;
  } else {
    const t=OPS_TASKS[gi]; const s=getOpsStatus(t.id);
    const opsFilterMap={todo:"never",inplace:"due",verified:"ontrack"};
    const mf=currentFilter==="all"||(opsFilterMap[currentFilter]&&s===opsFilterMap[currentFilter])||s==="overdue"&&currentFilter==="todo";
    const ms=!search||t.title.toLowerCase().includes(search)||t.id.toLowerCase().includes(search);
    return mf&&ms;
  }
}

function setFilter(f){
  currentFilter=f;
  document.querySelectorAll(".fb").forEach(b=>b.classList.remove("active"));
  const map={all:"fa",todo:"ft",inplace:"fi",verified:"fv"};
  document.querySelector(".fb."+map[f])?.classList.add("active");
  refreshNavVisibility();
}

function filterSidebar(){ refreshNavVisibility(); }

function refreshNavVisibility(){
  if(currentTrack==="setup") setupItems.forEach(a=>{const el=document.getElementById("ni-"+a.gi);if(el)el.classList.toggle("hidden",!navShouldShow(a.gi,"setup"));});
  else OPS_TASKS.forEach((_,i)=>{const el=document.getElementById("oni-"+i);if(el)el.classList.toggle("hidden",!navShouldShow(i,"ops"));});
}

        <div class="wcard" style="--wc:var(--red)"><div class="wcard-n">${ov}</div><div class="wcard-l">overdue</div></div>
        <div class="wcard" style="--wc:var(--amber)"><div class="wcard-n">${due}</div><div class="wcard-l">due soon</div></div>
        <div class="wcard" style="--wc:var(--green)"><div class="wcard-n">${ok}</div><div class="wcard-l">on track</div></div>
        <div class="wcard" style="--wc:var(--text3)"><div class="wcard-n">${nev}</div><div class="wcard-l">never run</div></div>
      </div>
      <div class="welcome-actions">
        ${ov>0?`<button class="btn-primary" onclick="jumpFirstOverdue()">Review overdue tasks →</button>`:`<button class="btn-primary" onclick="showOpsItem(0)">Start from beginning →</button>`}
        <button class="btn-sec" onclick="switchTrack('setup')">← Back to setup</button>
      </div>
    </div>`;
}

function jumpFirstOverdue(){
  const i=OPS_TASKS.findIndex(t=>getOpsStatus(t.id)==="overdue");
  if(i>=0) showOpsItem(i);
}

// ==================== SETUP ITEM ====================
function showSetupItem(gi){
  if(gi<0||gi>=setupItems.length) return;
  currentItem={track:"setup",gi};
  const a=setupItems[gi]; const ph=RUNBOOK[a.phaseIdx];
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  const nel=document.getElementById("ni-"+gi);
  if(nel){nel.classList.add("active");nel.scrollIntoView({block:"nearest",behavior:"smooth"});}
  updateProgress();
  const s=getSetupStatus(a.id);
  const badges=(a.tools||[]).map(t=>`<span class="sbadge ${badgeMap[t]||"sb-b"}">${t}</span>`).join(" ");
  const stepsHtml=a.steps.map((st,si)=>`<div class="step"><div class="step-num">${si+1}</div><div class="step-body"><div class="step-h">${st.h}</div><div class="step-b">${st.b}</div></div></div>`).join("");
  const tipHtml=a.tip?`<div class="callout ct"><div class="c-icon">💡</div><div>${a.tip}</div></div>`:"";
  const warnHtml=a.warn?`<div class="callout cw"><div class="c-icon">⚠️</div><div>${a.warn}</div></div>`:"";
  document.getElementById("content").innerHTML=`
    <div class="item-view">
      <div class="item-crumb">${ph.phase} <em>›</em> ${a.id}</div>
      <div class="item-phase-tag" style="background:${ph.color}16;color:${ph.color};border:1px solid ${ph.color}38">${phaseIcons[ph.icon]||"📌"} ${ph.phase}</div>
      <div class="item-title">${a.title}</div>
      <div class="item-meta-row"><span class="est-tag">⏱ ${a.est}</span>${badges}</div>
      <div class="status-toggle">
        <div class="status-toggle-label">How does this control stand in your environment?</div>
        <div class="status-opts">
          <button class="sopt todo ${s==="todo"?"active":""}" onclick="setSetupStatus(${gi},'todo')">To do</button>
          <button class="sopt inplace ${s==="inplace"?"active":""}" onclick="setSetupStatus(${gi},'inplace')">In place</button>
          <button class="sopt verified ${s==="verified"?"active":""}" onclick="setSetupStatus(${gi},'verified')">✓ Verified</button>
        </div>
      </div>
      <div class="why-card"><div class="why-icon">🎯</div><div><div class="why-label">Why this matters</div><div class="why-text">${a.why}</div></div></div>
      <div class="steps-hdr"><div class="steps-lbl">Step-by-step procedure</div><div class="steps-ct">${a.steps.length} steps</div></div>
      <div class="steps">${stepsHtml}</div>
      ${tipHtml}${warnHtml}
      <div class="item-nav">
        <button class="inav-btn" onclick="showSetupItem(${gi-1})" ${gi===0?"disabled":""}>← Prev</button>
        <div class="inav-pos">${gi+1} of ${setupItems.length}</div>
        <button class="inav-btn" onclick="showSetupItem(${gi+1})" ${gi===setupItems.length-1?"disabled":""}>Next →</button>
      </div>
    </div>`;
}

function setSetupStatus(gi,s){
  const a=setupItems[gi];
  setupStates[a.id]=s; save();
  document.querySelectorAll(".sopt").forEach(b=>{b.classList.remove("active");if(b.classList.contains(s))b.classList.add("active");});
  const nel=document.getElementById("ni-"+gi);
  if(nel){const dot=nel.querySelector(".nav-dot");if(dot)dot.className="nav-dot "+s;}
  refreshNavVisibility(); updateProgress();
}

// ==================== OPS ITEM ====================
function showOpsItem(i){
  if(i<0||i>=OPS_TASKS.length) return;
  currentItem={track:"ops",gi:i};
  const task=OPS_TASKS[i];
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  const nel=document.getElementById("oni-"+i);
  if(nel){nel.classList.add("active");nel.scrollIntoView({block:"nearest",behavior:"smooth"});}
  updateProgress();
  const s=getOpsStatus(task.id);
  const d=getOpsData(task.id);
  const days=getOpsDaysUntilDue(task.id);
  let dueText="Never run — log your first completion below.";
  if(days!==null){ dueText=days<0?`Overdue by ${Math.abs(days)} day${Math.abs(days)!==1?"s":""}`:days===0?"Due today":`Due in ${days} day${days!==1?"s":""}`; }
  const historyHtml=d.history&&d.history.length>0
    ?[...d.history].reverse().slice(0,5).map(e=>`<div class="sc-entry"><div class="sc-entry-dot"></div><span class="sc-entry-date">${e.date}</span>${e.note?`<span class="sc-entry-note">— ${e.note}</span>`:""}</div>`).join("")
    :`<div class="sc-no-history">No completions logged yet.</div>`;
  const stepsHtml=task.steps.map((st,si)=>`<div class="step"><div class="step-num">${si+1}</div><div class="step-body"><div class="step-h">${st.h}</div><div class="step-b">${st.b}</div></div></div>`).join("");
  const tipHtml=task.tip?`<div class="callout ct"><div class="c-icon">💡</div><div>${task.tip}</div></div>`:"";
  const warnHtml=task.warn?`<div class="callout cw"><div class="c-icon">⚠️</div><div>${task.warn}</div></div>`:"";
  document.getElementById("content").innerHTML=`
    <div class="item-view">
      <div class="item-crumb">Operations <em>›</em> ${task.id}</div>
      <div class="cadence-badge ${s}">🔁 ${task.cadenceLabel}</div>
      <div class="item-title">${task.title}</div>
      <div class="item-meta-row"><span class="est-tag">⏱ ${task.est}</span><span class="sbadge" style="background:${task.color}18;border:1px solid ${task.color}40;color:${task.color};font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:3px">${task.category}</span></div>
      <div class="schedule-card">
        <div class="sc-row">
          <div class="sc-item"><div class="sc-label">Cadence</div><div class="sc-value">${task.cadenceLabel}</div></div>
          <div class="sc-item"><div class="sc-label">Status</div><div class="sc-value ${s}">${dueText}</div></div>
          <button class="log-btn" onclick="openLogModal('${task.id}')">✓ Log completed</button>
        </div>
        <div class="sc-history">
          <div class="sc-history-label">Completion history (last 5)</div>
          <div class="sc-history-entries">${historyHtml}</div>
        </div>
      </div>
      <div class="why-card"><div class="why-icon">🎯</div><div><div class="why-label">Why this matters</div><div class="why-text">${task.why}</div></div></div>
      <div class="steps-hdr"><div class="steps-lbl">Procedure</div><div class="steps-ct">${task.steps.length} steps</div></div>
      <div class="steps">${stepsHtml}</div>
      ${tipHtml}${warnHtml}
      <div class="item-nav">
        <button class="inav-btn" onclick="showOpsItem(${i-1})" ${i===0?"disabled":""}>← Prev</button>
        <div class="inav-pos">${i+1} of ${OPS_TASKS.length}</div>
        <button class="inav-btn" onclick="showOpsItem(${i+1})" ${i===OPS_TASKS.length-1?"disabled":""}>Next →</button>
      </div>
    </div>`;
}

// ==================== LOG MODAL ====================
function openLogModal(id){
  pendingLogId=id;
  const task=OPS_TASKS.find(t=>t.id===id);
  document.getElementById("log-modal-sub").textContent=task.title+" · "+task.cadenceLabel;
  document.getElementById("log-note").value="";
  document.getElementById("log-modal").classList.add("open");
  setTimeout(()=>document.getElementById("log-note").focus(),50);
}
function closeLogModal(){ document.getElementById("log-modal").classList.remove("open"); pendingLogId=null; }
function confirmLog(){
  if(!pendingLogId) return;
  const note=document.getElementById("log-note").value.trim();
  const d=getOpsData(pendingLogId);
  if(!d.history) d.history=[];
  d.history.push({date:new Date().toLocaleDateString("en-CA"),note});
  opsStates[pendingLogId]=d; save();
  const i=OPS_TASKS.findIndex(t=>t.id===pendingLogId);
  const nel=document.getElementById("oni-"+i);
  if(nel){const dot=nel.querySelector(".nav-dot");if(dot)dot.className="nav-dot "+getOpsStatus(pendingLogId);}
  closeLogModal();
  updateProgress();
  showOpsItem(i);
}

// ==================== SUMMARY ====================
function showSummary(){
  currentItem=null;
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  updateProgress();
  const ver=setupItems.filter(a=>getSetupStatus(a.id)==="verified").length;
  const inp=setupItems.filter(a=>getSetupStatus(a.id)==="inplace").length;
  const todo=setupItems.length-ver-inp;
  const ov=OPS_TASKS.filter(t=>getOpsStatus(t.id)==="overdue").length;
  const setupRows=RUNBOOK.map(ph=>{
    const v=ph.items.filter(i=>getSetupStatus(i.id)==="verified").length;
    const p=ph.items.filter(i=>getSetupStatus(i.id)==="inplace").length;
    const t=ph.items.length-v-p;
    return `<tr><td>${ph.phase}</td><td>${ph.items.length}</td><td>${v?`<span class="spill sp-ver">✓ ${v}</span>`:"—"}</td><td>${p?`<span class="spill sp-inp">⏳ ${p}</span>`:"—"}</td><td>${t?`<span class="spill sp-todo">${t}</span>`:"—"}</td></tr>`;
  }).join("");
  const opsRows=OPS_TASKS.map(task=>{
    const s=getOpsStatus(task.id);
    const d=getOpsData(task.id);
    const last=d.history&&d.history.length>0?d.history[d.history.length-1].date:"Never";
    const pillClass={overdue:"sp-ov",due:"sp-due",ontrack:"sp-ok",never:"sp-nev"}[s];
    const pillLabel={overdue:"Overdue",due:"Due soon",ontrack:"On track",never:"Never run"}[s];
    return `<tr><td>${task.id}</td><td>${task.title}</td><td>${task.cadenceLabel}</td><td>${last}</td><td><span class="spill ${pillClass}">${pillLabel}</span></td></tr>`;
  }).join("");
  document.getElementById("content").innerHTML=`
    <div class="summary-view" style="max-width:700px">
      <div class="sum-h">Status Summary</div>
      <div class="sum-sub">Generated ${new Date().toLocaleDateString("en-CA")} · ${setupItems.length} setup controls · ${OPS_TASKS.length} recurring tasks</div>
      <div class="sum-bigstats">
        <div class="bstat" style="--bsa:var(--green)"><div class="bstat-n">${ver}</div><div class="bstat-l">verified</div></div>
        <div class="bstat" style="--bsa:var(--amber)"><div class="bstat-n">${inp}</div><div class="bstat-l">in place</div></div>
        <div class="bstat" style="--bsa:var(--text3)"><div class="bstat-n">${todo}</div><div class="bstat-l">to do</div></div>
        <div class="bstat" style="--bsa:var(--red)"><div class="bstat-n">${ov}</div><div class="bstat-l">ops overdue</div></div>
      </div>
      <div class="sum-section-title">Setup controls — by phase</div>
      <table class="sum-table"><thead><tr><th>Phase</th><th>Total</th><th>Verified</th><th>In place</th><th>To do</th></tr></thead><tbody>${setupRows}</tbody></table>
      <div class="sum-section-title">Operations — task status</div>
      <table class="sum-table"><thead><tr><th>ID</th><th>Task</th><th>Cadence</th><th>Last run</th><th>Status</th></tr></thead><tbody>${opsRows}</tbody></table>
      <button class="copy-btn" onclick="copyReport()">Copy report as text</button>
    </div>`;
}

function copyReport(){
  const lines=["ENDPOINT SECURITY RUNBOOK — STATUS REPORT","Generated: "+new Date().toLocaleDateString("en-CA"),"","== SETUP CONTROLS ==","ID | Control | Phase | Status"];
  setupItems.forEach(a=>{const s=getSetupStatus(a.id);lines.push(`${a.id} | ${a.title} | ${RUNBOOK[a.phaseIdx].phase} | ${s==="verified"?"Verified":s==="inplace"?"In place":"To do"}`);});
  lines.push("","== OPERATIONS ==","ID | Task | Cadence | Last Run | Status");
  OPS_TASKS.forEach(t=>{const s=getOpsStatus(t.id);const d=getOpsData(t.id);const last=d.history&&d.history.length>0?d.history[d.history.length-1].date:"Never";lines.push(`${t.id} | ${t.title} | ${t.cadenceLabel} | ${last} | ${s}`);});
  navigator.clipboard.writeText(lines.join("\n")).then(()=>{const btn=document.querySelector(".copy-btn");if(btn){btn.textContent="Copied!";setTimeout(()=>{btn.textContent="Copy report as text"},2000);}});
}

// ==================== QUICK SEARCH ====================
let qsFocus=0;
function openSearch(){
  document.getElementById("qs-overlay").classList.add("open");
  document.getElementById("qs-input").value="";
  renderQs(""); setTimeout(()=>document.getElementById("qs-input").focus(),40);
}
function closeSearch(){ document.getElementById("qs-overlay").classList.remove("open"); }
document.getElementById("qs-input").addEventListener("input",e=>renderQs(e.target.value));
document.getElementById("qs-overlay").addEventListener("click",e=>{if(e.target===e.currentTarget)closeSearch();});

function renderQs(q){
  qsFocus=0;
  const sq=q.toLowerCase();
  const sItems=setupItems.filter(a=>!sq||a.title.toLowerCase().includes(sq)||a.id.toLowerCase().includes(sq)).slice(0,8);
  const oItems=OPS_TASKS.filter(t=>!sq||t.title.toLowerCase().includes(sq)||t.id.toLowerCase().includes(sq)).slice(0,4);
  const all=[...sItems.map(a=>({type:"setup",gi:a.gi,id:a.id,title:a.title})),...oItems.map((t,i)=>({type:"ops",gi:OPS_TASKS.indexOf(t),id:t.id,title:t.title}))];
  const el=document.getElementById("qs-results");
  if(!all.length){el.innerHTML=`<div class="qs-empty">No results for "${q}"</div>`;return;}
  el.innerHTML=all.map((r,i)=>`<div class="qs-result${i===0?" focused":""}" data-type="${r.type}" data-gi="${r.gi}">
    <span class="qs-r-track ${r.type==="setup"?"qs-r-setup":"qs-r-ops"}">${r.type==="setup"?"Setup":"Ops"}</span>
    <span class="qs-r-id">${r.id}</span>
    <span class="qs-r-title">${r.title}</span>
  </div>`).join("");
  el.querySelectorAll(".qs-result").forEach(r=>{r.addEventListener("click",()=>{const t=r.dataset.type;const g=parseInt(r.dataset.gi);closeSearch();if(t==="setup"){currentTrack="setup";document.getElementById("tab-setup").classList.add("active");document.getElementById("tab-ops").classList.remove("active");buildNav();showSetupItem(g);}else{currentTrack="ops";document.getElementById("tab-ops").classList.add("active");document.getElementById("tab-setup").classList.remove("active");buildNav();showOpsItem(g);}});});
}

// ==================== KEYBOARD ====================
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!e.ctrlKey&&!e.metaKey&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA"){e.preventDefault();openSearch();return;}
  if(e.key==="Escape"){closeLogModal();closeSearch();return;}
  const qsOpen=document.getElementById("qs-overlay").classList.contains("open");
  if(qsOpen){
    const rs=document.querySelectorAll(".qs-result");
    if(e.key==="ArrowDown"){e.preventDefault();rs[qsFocus]?.classList.remove("focused");qsFocus=Math.min(qsFocus+1,rs.length-1);rs[qsFocus]?.classList.add("focused");rs[qsFocus]?.scrollIntoView({block:"nearest"});}
    if(e.key==="ArrowUp"){e.preventDefault();rs[qsFocus]?.classList.remove("focused");qsFocus=Math.max(qsFocus-1,0);rs[qsFocus]?.classList.add("focused");rs[qsFocus]?.scrollIntoView({block:"nearest"});}
    if(e.key==="Enter"){rs[qsFocus]?.click();}
    return;
  }
  if(currentItem){
    if(e.key==="ArrowRight"||e.key==="]"){ currentItem.track==="setup"?showSetupItem(currentItem.gi+1):showOpsItem(currentItem.gi+1); }
    if(e.key==="ArrowLeft"||e.key==="["){ currentItem.track==="setup"?showSetupItem(currentItem.gi-1):showOpsItem(currentItem.gi-1); }
    if(currentItem.track==="setup"){
      if(e.key==="1") setSetupStatus(currentItem.gi,"todo");
      if(e.key==="2") setSetupStatus(currentItem.gi,"inplace");
      if(e.key==="3") setSetupStatus(currentItem.gi,"verified");
    }
  }
});

// ==================== INIT ====================
buildNav(); updateProgress(); showWelcome();
</script>
</body>
</html>
